<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #ffffff; --bg-secondary: #ffffff; --bg-card: #ffffff;
      --bg-hover: #f5f5f5; --border-color: #000000; --text-primary: #000000;
      --text-secondary: #000000; --text-muted: #555555;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
    .app-container { max-width: 100%; margin: 0; padding: 0; }
    
    .company-header {
      background: var(--bg-card); border-bottom: 2px solid var(--border-color);
      padding: 24px 32px; margin-bottom: 20px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .company-left { display: flex; align-items: center; gap: 18px; }
    .company-logo {
      width: 52px; height: 52px; background: #000000; display: flex; align-items: center; 
      justify-content: center; font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: -1px;
    }
    .company-name { font-size: 26px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .company-subtitle { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }
    .date-box { text-align: right; }
    .date-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
    .date-value { font-size: 18px; font-weight: 800; color: var(--text-primary); }
    .date-day { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-top: 1px; }

    .report-title { font-size: 20px; font-weight: 800; text-transform: uppercase; padding: 0 32px; margin-bottom: 20px; letter-spacing: 1px; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding: 0 32px; flex-wrap: wrap; }
    .search-box { position: relative; flex: 1; min-width: 240px; max-width: 400px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 40px; border: 1px solid var(--border-color); font-size: 13px; outline: none; font-family: 'Inter', sans-serif; }
    .search-box input:focus { border: 2px solid var(--border-color); }
    .search-box .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

    .table-wrapper { background: var(--bg-card); border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; border-bottom: 2px solid #000000; }
    thead { position: sticky; top: 0; z-index: 10; }
    
    thead th {
      background: #ffffff; padding: 14px 16px; text-align: left; font-weight: 800; font-size: 11px;
      text-transform: uppercase; letter-spacing: 1px; color: var(--text-primary); border-bottom: 3px solid var(--border-color);
      white-space: nowrap; cursor: pointer; transition: background 0.2s; user-select: none;
    }
    thead th:hover { background: #f0f0f0; }
    thead th:first-child { padding-left: 24px; cursor: default; background: #ffffff; }

    tbody tr { border-bottom: 2px solid var(--border-color); }
    tbody tr:hover { background: var(--bg-hover); }
    tbody tr:last-child { border-bottom: none; }
    
    tbody td { padding: 11px 16px; white-space: nowrap; max-width: 250px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; border-right: 1px solid #e0e0e0; }
    tbody td:last-child { border-right: none; }
    tbody td:first-child { padding-left: 24px; }
    
    .wrap-text { white-space: normal !important; min-width: 250px; line-height: 1.5; }

    .row-num { color: var(--text-muted); font-size: 11px; font-weight: 600; min-width: 36px; }

    .remark-input { 
      width: 100%; min-width: 160px; padding: 8px 10px; background: #ffffff; 
      border: 1px solid #c2c2c2; border-radius: 4px; font-size: 13px; 
      font-family: 'Inter', sans-serif; outline: none; transition: all 0.2s; 
    }
    .remark-input:focus { border-color: #000000; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }

    .star-cell { color: #d97706; font-size: 16px; letter-spacing: 2px; }
    .sort-icon { font-size: 10px; margin-left: 4px; color: var(--text-muted); }

    .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 20px; }
    .spinner { width: 42px; height: 42px; border: 4px solid var(--border-color); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; font-weight: 700; text-transform: uppercase; }

    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    .error-banner { background: #ffffff; border: 2px solid #000000; padding: 14px 20px; margin-bottom: 20px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 10px; }

    /* ===== HEADER FILTER DROPDOWN ===== */
    .filterable-th { position: relative; }
    .filterable-th .th-label { display: inline; }
    .filter-arrow { font-size: 9px; margin-left: 5px; color: #1a73e8; vertical-align: middle; }
    .filter-active .th-label { color: #1a73e8; }

    .col-filter-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      background: #ffffff;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      min-width: 220px;
      max-height: 340px;
      overflow: hidden;
      flex-direction: column;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
      cursor: default;
    }
    .col-filter-dropdown.open { display: flex; }

    .col-filter-search {
      padding: 8px 10px;
      border: none;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 100%;
    }
    .col-filter-search::placeholder { color: #aaa; }

    .col-filter-list {
      overflow-y: auto;
      max-height: 270px;
      padding: 4px 0;
    }

    .col-filter-item {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      gap: 8px;
      white-space: nowrap;
    }
    .col-filter-item:hover { background: #f0f4ff; }
    .col-filter-item input[type="checkbox"] {
      width: 15px; height: 15px; cursor: pointer; accent-color: #1a73e8; flex-shrink: 0;
    }
    .col-filter-item label { cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: #222; }
    .col-filter-item .filter-count { color: #888; font-size: 11px; margin-left: auto; flex-shrink: 0; }

    .col-filter-item.select-all { border-bottom: 1px solid #e8e8e8; font-weight: 700; padding-bottom: 8px; margin-bottom: 2px; }
    .col-filter-item.select-all label { font-weight: 700; }

    @media (max-width: 768px) {
      .app-container { padding: 12px; }
      .company-header { padding: 20px; flex-direction: column; align-items: flex-start; }
      .date-box { text-align: left; }
      .report-title { padding: 0 20px; }
      .toolbar { flex-direction: column; padding: 0 20px; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="serverData" style="display:none;"><?= preloadedData ?></div>

  <div class="app-container">
    <div class="company-header fade-in">
      <div class="company-left">
        <div class="company-logo">H</div>
        <div>
          <div class="company-name">HETALLS GLOBAL</div>
          <div class="company-subtitle">PVT. LTD.</div>
        </div>
      </div>
      
      <div style="flex: 1; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--text-primary);">
        REPORT NUMBER - 16
      </div>

      <div class="date-box">
        <div class="date-label">Report Date</div>
        <div class="date-value" id="currentDate"></div>
        <div class="date-day" id="currentDay"></div>
      </div>
    </div>

    <h2 class="report-title fade-in">ORDER NOT SHIPPED IN 3 DAY</h2>

    <div class="error-banner fade-in" id="errorBanner" style="display:none;">
      <span>⚠️</span><span id="errorText"></span>
    </div>

    <div class="toolbar fade-in">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search across all columns..." oninput="filterTable()">
      </div>
    </div>

    <div class="table-wrapper fade-in">
      <div class="table-scroll">
        <div class="loading-container" id="loadingState">
          <div class="spinner"></div>
          <div class="loading-text">Fetching live data...</div>
        </div>

        <table id="dataTable" style="display:none;">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="icon">📭</div>
          <h3>No Records Found</h3>
          <p>All rows have Column H filled, or the sheet is empty.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allRows = [];
    let headers = [];
    let currentSortCol = -1;
    let sortAsc = true;

    // Column filter state: colIdx -> Set of selected values (null = all selected)
    const colFilters = {};
    // Which columns get filter dropdowns (resolved in onDataLoaded)
    let filterableCols = {}; // headerName -> colIdx

    const searchInputEl = document.getElementById('searchInput');
    const tableBodyEl = document.getElementById('tableBody');
    const tableHeadEl = document.getElementById('tableHead');
    const emptyStateEl = document.getElementById('emptyState');
    const dataTableEl = document.getElementById('dataTable');
    const loadingStateEl = document.getElementById('loadingState');

    function setCurrentDate() {
      const now = new Date();
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      document.getElementById('currentDate').textContent = String(now.getDate()).padStart(2, '0') + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
      document.getElementById('currentDay').textContent = days[now.getDay()];
    }

    function findColIndex(headerName) {
      for (var i = 0; i < headers.length; i++) {
        if (headers[i].toUpperCase().indexOf(headerName) !== -1) return i;
      }
      return -1;
    }

    // Build unique values + counts for a column
    function getColumnValues(colIdx) {
      var counts = {};
      for (var i = 0; i < allRows.length; i++) {
        var v = String(allRows[i][colIdx] || '').trim();
        if (v) counts[v] = (counts[v] || 0) + 1;
      }
      var keys = Object.keys(counts).sort();
      return keys.map(function(k) { return { value: k, count: counts[k] }; });
    }

    // Build the dropdown HTML inside a <th>
    function buildFilterDropdown(colIdx) {
      var items = getColumnValues(colIdx);
      var totalCount = 0;
      for (var i = 0; i < items.length; i++) totalCount += items[i].count;

      var html = '';
      html += '<div class="col-filter-dropdown" id="filterDrop_' + colIdx + '" onclick="event.stopPropagation()">';
      html += '<input type="text" class="col-filter-search" placeholder="Search items..." oninput="searchFilterItems(' + colIdx + ', this.value)">';
      html += '<div class="col-filter-list" id="filterList_' + colIdx + '">';
      
      // SELECT ALL
      html += '<div class="col-filter-item select-all" data-val="__ALL__">';
      html += '<input type="checkbox" checked id="filterCb_' + colIdx + '_all" onchange="toggleSelectAll(' + colIdx + ', this.checked)">';
      html += '<label for="filterCb_' + colIdx + '_all">SELECT ALL</label>';
      html += '<span class="filter-count">(' + totalCount + ')</span>';
      html += '</div>';
      
      // Individual items
      for (var i = 0; i < items.length; i++) {
        var safeVal = escapeAttr(items[i].value);
        var cbId = 'filterCb_' + colIdx + '_' + i;
        html += '<div class="col-filter-item" data-val="' + safeVal + '">';
        html += '<input type="checkbox" checked id="' + cbId + '" value="' + safeVal + '" onchange="toggleFilterItem(' + colIdx + ')">';
        html += '<label for="' + cbId + '">' + escapeHtml(items[i].value) + '</label>';
        html += '<span class="filter-count">(' + items[i].count + ')</span>';
        html += '</div>';
      }
      
      html += '</div></div>';
      return html;
    }

    function toggleFilterDropdown(colIdx, event) {
      event.stopPropagation();
      var drop = document.getElementById('filterDrop_' + colIdx);
      if (!drop) return;
      
      // Close all other dropdowns first
      var allDrops = document.querySelectorAll('.col-filter-dropdown.open');
      for (var i = 0; i < allDrops.length; i++) {
        if (allDrops[i] !== drop) allDrops[i].classList.remove('open');
      }
      
      drop.classList.toggle('open');
    }

    function searchFilterItems(colIdx, query) {
      var list = document.getElementById('filterList_' + colIdx);
      if (!list) return;
      var q = query.toLowerCase().trim();
      var items = list.querySelectorAll('.col-filter-item');
      for (var i = 0; i < items.length; i++) {
        var val = items[i].getAttribute('data-val');
        if (val === '__ALL__') continue; // always show SELECT ALL
        items[i].style.display = (!q || val.toLowerCase().indexOf(q) !== -1) ? 'flex' : 'none';
      }
    }

    function toggleSelectAll(colIdx, checked) {
      var list = document.getElementById('filterList_' + colIdx);
      var checkboxes = list.querySelectorAll('input[type="checkbox"]');
      for (var i = 0; i < checkboxes.length; i++) {
        checkboxes[i].checked = checked;
      }
      applyColFilter(colIdx);
    }

    function toggleFilterItem(colIdx) {
      var list = document.getElementById('filterList_' + colIdx);
      var checkboxes = list.querySelectorAll('.col-filter-item:not(.select-all) input[type="checkbox"]');
      var allCb = document.getElementById('filterCb_' + colIdx + '_all');
      
      var allChecked = true;
      for (var i = 0; i < checkboxes.length; i++) {
        if (!checkboxes[i].checked) { allChecked = false; break; }
      }
      if (allCb) allCb.checked = allChecked;
      
      applyColFilter(colIdx);
    }

    function applyColFilter(colIdx) {
      var list = document.getElementById('filterList_' + colIdx);
      var checkboxes = list.querySelectorAll('.col-filter-item:not(.select-all) input[type="checkbox"]');
      
      var selected = new Set();
      var allChecked = true;
      for (var i = 0; i < checkboxes.length; i++) {
        if (checkboxes[i].checked) {
          selected.add(checkboxes[i].value);
        } else {
          allChecked = false;
        }
      }
      
      // If all checked, remove filter (no filtering needed)
      if (allChecked) {
        delete colFilters[colIdx];
      } else {
        colFilters[colIdx] = selected;
      }
      
      // Update header styling to show active filter
      var th = document.getElementById('filterTh_' + colIdx);
      if (th) {
        if (allChecked) th.classList.remove('filter-active');
        else th.classList.add('filter-active');
      }
      
      filterTable();
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', function() {
      var allDrops = document.querySelectorAll('.col-filter-dropdown.open');
      for (var i = 0; i < allDrops.length; i++) {
        allDrops[i].classList.remove('open');
      }
    });

    function onDataLoaded(responseString) {
      if(loadingStateEl) loadingStateEl.style.display = 'none';
      var result;
      try {
        result = JSON.parse(responseString);
      } catch(e) {
        showError('Failed to parse data');
        return;
      }
      
      if (result.error) { showError(result.error); return; }

      headers = result.headers || [];
      allRows = result.rows || [];

      if (allRows.length === 0) {
        emptyStateEl.style.display = 'block';
        return;
      }

      // Resolve filterable columns
      var itemIdx = findColIndex('ITEM');
      if (itemIdx === -1) itemIdx = 3;
      var saleDateIdx = findColIndex('SALE DATE');
      if (saleDateIdx === -1) saleDateIdx = findColIndex('SALE');
      if (saleDateIdx === -1) saleDateIdx = 4;
      
      filterableCols[itemIdx] = true;
      filterableCols[saleDateIdx] = true;

      // Pre-compute lowercase string buffer for text searching
      for (var i = 0; i < allRows.length; i++) {
        allRows[i].push(allRows[i].join(' ').toLowerCase());
      }

      renderTableHeaders();
      filterTable(); 
      dataTableEl.style.display = 'table';
    }

    function renderTableHeaders() {
      var headHTML = ['<tr><th class="row-num">#</th>'];
      for (var idx = 0; idx < headers.length; idx++) {
        var h = headers[idx];
        
        if (filterableCols[idx]) {
          // Filterable column: add dropdown inside the <th>
          headHTML.push('<th class="filterable-th" id="filterTh_' + idx + '" onclick="toggleFilterDropdown(' + idx + ', event)" title="Click to filter ' + escapeHtml(h) + '">');
          headHTML.push('<span class="th-label">' + escapeHtml(h) + '</span>');
          headHTML.push('<span class="filter-arrow">▼</span>');
          headHTML.push('<span class="sort-icon" id="sortIcon' + idx + '"></span>');
          headHTML.push(buildFilterDropdown(idx));
          headHTML.push('</th>');
        } else {
          headHTML.push('<th onclick="sortTable(' + idx + ')" title="Click to sort by ' + escapeHtml(h) + '">' + escapeHtml(h) + ' <span class="sort-icon" id="sortIcon' + idx + '"></span></th>');
        }
      }
      headHTML.push('</tr>');
      tableHeadEl.innerHTML = headHTML.join(''); 
    }

    function sortTable(colIdx) {
      if (currentSortCol === colIdx) sortAsc = !sortAsc;
      else { currentSortCol = colIdx; sortAsc = true; }
      
      for (var i = 0; i < headers.length; i++) {
        let el = document.getElementById('sortIcon'+i);
        if(el) el.textContent = (i === colIdx) ? (sortAsc ? '▲' : '▼') : '';
      }

      allRows.sort(function(a, b) {
        let valA = a[colIdx];
        let valB = b[colIdx];
        
        let numA = parseFloat(valA);
        let numB = parseFloat(valB);
        if (!isNaN(numA) && !isNaN(numB) && String(valA).trim() !== '' && String(valB).trim() !== '') {
          return sortAsc ? (numA - numB) : (numB - numA);
        }
        
        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      filterTable(); 
    }

    function filterTable() {
      var q = searchInputEl.value.toLowerCase().trim();
      var hasColFilters = Object.keys(colFilters).length > 0;
      var dataToRender = allRows;

      if (q || hasColFilters) {
        dataToRender = allRows.filter(function(row) {
          // Text search (pre-computed lowercase string is at last index)
          if (q && row[row.length - 1].indexOf(q) === -1) return false;
          // Column checkbox filters
          for (var ci in colFilters) {
            var val = String(row[ci] || '').trim();
            if (!colFilters[ci].has(val)) return false;
          }
          return true;
        });
      }

      renderRows(dataToRender);

      if (dataToRender.length === 0) {
        emptyStateEl.style.display = 'block';
        emptyStateEl.querySelector('h3').textContent = 'No matching records';
        emptyStateEl.querySelector('p').textContent = 'Try a different search term or filter.';
      } else {
        emptyStateEl.style.display = 'none';
      }
    }

    function saveRemark(inputEl, rfNo) {
      inputEl.style.backgroundColor = '#fff9c4';
      
      google.script.run
        .withSuccessHandler(function(savedValue) {
          inputEl.style.backgroundColor = '#c8e6c9';
          inputEl.value = savedValue;
          setTimeout(function() { inputEl.style.backgroundColor = '#ffffff'; }, 2000);
        })
        .withFailureHandler(function(err) {
          inputEl.style.backgroundColor = '#ffcdd2';
          alert('Error saving remark: ' + err.message);
        })
        .updateRemark(rfNo, inputEl.value);
    }

    function renderRows(rows) {
      var htmlArray = []; 
      
      for (var idx = 0; idx < rows.length; idx++) {
        var row = rows[idx];
        htmlArray.push('<tr><td class="row-num">', (idx + 1), '</td>');
        
        var rfNo = row[0]; 
        
        for (var ci = 0; ci < headers.length; ci++) {
          var cell = row[ci];
          
          if (ci === headers.length - 1) { 
            htmlArray.push('<td><input type="text" class="remark-input" placeholder="Type here..." onchange="saveRemark(this, \'', escapeAttr(rfNo), '\')" value="', escapeAttr(cell), '"></td>');
          } else if (headers[ci] === 'STAR') {
            htmlArray.push('<td class="star-cell" title="', escapeAttr(cell), '">', escapeHtml(cell), '</td>');
          } else if (headers[ci] === 'REMARK') {
            htmlArray.push('<td class="wrap-text" title="', escapeAttr(cell), '">', escapeHtml(cell), '</td>');
          } else {
            htmlArray.push('<td title="', escapeAttr(cell), '">', escapeHtml(cell), '</td>');
          }
        }
        htmlArray.push('</tr>');
      }
      
      tableBodyEl.innerHTML = htmlArray.join(''); 
    }

    function showError(m) {
      document.getElementById('errorBanner').style.display = 'flex';
      document.getElementById('errorText').textContent = m;
    }
    
    function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escapeAttr(s) { return escapeHtml(s); }

    // ==========================================
    // ZERO-LATENCY EXECUTION
    // ==========================================
    setCurrentDate();
    const serverDataElement = document.getElementById('serverData');
    
    if (serverDataElement && serverDataElement.textContent) {
      onDataLoaded(serverDataElement.textContent);
    } else {
      google.script.run.withSuccessHandler(onDataLoaded).withFailureHandler(function(e){ showError(e.message) }).getFilteredData();
    }
  </script>
</body>
</html>
